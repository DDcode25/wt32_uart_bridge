; PlatformIO project for WT32-ETH01 (ESP32-WROOM-32 + LAN8720A)
; Native ESP-IDF framework, NO Arduino Core.

[platformio]
; Проект использует нативную для ESP-IDF раскладку с компонентом main/,
; поэтому сборка одинаково работает и через `pio run`, и через `idf.py`.
src_dir = main
default_envs = wt32-eth01

[env:wt32-eth01]
; Штатная платформа из реестра PlatformIO. Версия 6.10.0 даёт
; ESP-IDF 5.4.0, что удовлетворяет требованию проекта (IDF >= 5.1).
platform = espressif32@6.10.0
board = wt32-eth01
framework = espidf

board_build.partitions = partitions.csv

; PlatformIO не разбирает EMBED_FILES из main/CMakeLists.txt и генерирует
; index.html.S собственным билдером. Путь совпадает с тем, что ожидает
; CMake, поэтому EMBED_FILES остаётся на месте ради сборки через idf.py.
board_build.embed_files =
    main/www/index.html

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

upload_speed = 460800

; Параметры Ethernet/флеша задаются через sdkconfig.defaults (Kconfig).
; Дублировать их в build_flags нельзя — будет конфликт с sdkconfig.h.
build_flags =
    -Wall

; Прошивка через USB-UART адаптер:
;   GPIO0 -> GND во время подачи питания (режим загрузки),
;   RX/TX адаптера -> TX0/RX0 платы (перекрёстно), 3.3V логика.
; См. README раздел "Прошивка".
